name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot change what runs.
jobs:
  web:
    name: web (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [reference, with-bugs]
    # with-bugs has defects seeded on purpose: its failures are the bugs this suite catches
    # (see BUGS.md), so that leg is reported but does not fail the workflow.
    continue-on-error: ${{ matrix.project == 'with-bugs' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  desktop:
    name: desktop (Electron)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: System libraries for Chromium/Electron and a virtual display
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
      - run: xvfb-run --auto-servernum npx playwright test --project=electron
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mobile:
    name: mobile (Android emulator, Appium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APK_URL: https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk
      APK_SHA256: 703fe31311b9ff16557264f23d581ad95bf9bd4cb8f2897e52cdd20b5d49a407
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Download the app under test and check its hash
        run: |
          mkdir -p mobile/apps
          curl -sSfL -o mobile/apps/Android-MyDemoAppRN.1.3.0.build-244.apk "$APK_URL"
          echo "$APK_SHA256  mobile/apps/Android-MyDemoAppRN.1.3.0.build-244.apk" | sha256sum -c -
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: npm run test:mobile
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-logs
          path: mobile-results/
          retention-days: 14
